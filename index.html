<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Atendimentos</title>
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --surface: #ffffff;
            --text: #1f2937; --text-light: #6b7280; --border: #e2e8f0; --border-dark: #cbd5e1;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--surface); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Colunas */
        .left-column { width: 45%; padding: 20px; overflow-y: auto; border-right: 2px solid var(--border); }
        .right-column { width: 55%; padding: 20px; background-color: var(--bg); overflow-y: auto; }

        /* Formulário */
        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        .row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
        input, textarea { padding: 8px; border: 1px solid var(--border-dark); border-radius: 4px; font-size: 0.9rem; }
        textarea#descricao { min-height: 120px; background-color: #f1f5f9; }
        
        /* Botões */
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; }
        .modal-body { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        
        /* Cards */
        .card { background: white; padding: 15px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 10px; }
        .card-body { font-family: monospace; font-size: 0.85rem; background: var(--bg); padding: 10px; margin: 5px 0; }
        .sub-hist { font-family: monospace; font-size: 0.8rem; color: #444; border-top: 1px dashed #ccc; padding-top: 5px; margin-top: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="left-column">
    <h1>Novo Atendimento</h1>
    <form id="formAtendimento" class="form-grid">
        <div class="row-split">
            <div class="form-group"><label>Contatos</label><input type="text" id="contato" required></div>
            <div class="form-group"><label>CPF / CNPJ (Opcional)</label><input type="text" id="cpf"></div>
        </div>
        <div class="form-group"><label>Nome do Contato</label><input type="text" id="nomeContato" required></div>
        <div class="form-group"><label>Nome do Contrato</label><input type="text" id="nomeContrato" required></div>
        <div class="row-split">
            <div class="form-group">
                <label>Tipo de Contato</label>
                <div style="display: flex; gap: 10px; padding-top: 5px;">
                    <label><input type="radio" name="tipo" value="TELEFONE" required> Telefone</label>
                    <label><input type="radio" name="tipo" value="WHATSAPP" required> WhatsApp</label>
                </div>
            </div>
            <div class="form-group"><label>Protocolos</label><input type="text" id="protocolo" required></div>
        </div>
        <div class="form-group"><label>Descrição</label><textarea id="descricao" required></textarea></div>
        <button type="submit" class="btn btn-primary" id="btnGravar">Gravar Atendimento</button>
    </form>
</div>

<div class="right-column">
    <h2>Histórico do Dia</h2>
    <div id="listaHistorico"></div>
</div>

<!-- MODAL CADASTRO -->
<div id="modalCadastro" class="modal">
    <div class="modal-content">
        <h3>Gestão Cadastral</h3>
        <div class="modal-body">
            <label><input type="radio" name="statusCad" value="JÁ ATUALIZADO" required> Já estava atualizado</label>
            <label><input type="radio" name="statusCad" value="NÃO ALTERADO"> Dados não foram alterados</label>
            <label><input type="radio" name="statusCad" value="ALTERADO"> Alteração realizada:</label>
            <input type="text" id="emailRemovido" placeholder="E-mail removido">
            <input type="text" id="numRemovido" placeholder="Número removido">
            <input type="text" id="emailAdicionado" placeholder="E-mail adicionado">
            <input type="text" id="numAdicionado" placeholder="Número adicionado">
        </div>
        <button class="btn btn-primary" onclick="confirmarCadastro()">Confirmar Cadastro</button>
    </div>
</div>

<script>
    let historico = JSON.parse(localStorage.getItem('atendimentos')) || [];
    let cadastroStatus = null; // Guarda o estado do modal
    let ultimoTipo = 'TELEFONE';

    // MÁSCARA CONTATOS
    document.getElementById('contato').addEventListener('input', (e) => {
        let n = e.target.value.replace(/\D/g, '');
        e.target.value = n.length > 10 ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7,11)}` : `(${n.slice(0,2)}) ${n.slice(2)}`;
    });

    const form = document.getElementById('formAtendimento');
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!cadastroStatus) {
            document.getElementById('modalCadastro').style.display = 'flex';
        } else {
            finalizarGravacao();
        }
    });

    function confirmarCadastro() {
        const radios = document.getElementsByName('statusCad');
        let selecionado = null;
        for (let r of radios) if (r.checked) selecionado = r.value;
        
        if (!selecionado) return alert("Selecione uma opção");
        
        if (selecionado === 'ALTERADO') {
            const eR = document.getElementById('emailRemovido').value;
            const nR = document.getElementById('numRemovido').value;
            const eA = document.getElementById('emailAdicionado').value;
            const nA = document.getElementById('numAdicionado').value;
            if (!eR && !nR && !eA && !nA) return alert("Preencha ao menos uma alteração");
            cadastroStatus = { tipo: 'ALTERADO', eR, nR, eA, nA };
        } else {
            cadastroStatus = { tipo: selecionado };
        }
        document.getElementById('modalCadastro').style.display = 'none';
        finalizarGravacao();
    }

    function finalizarGravacao() {
        const nomeContato = document.getElementById('nomeContato').value;
        const tipo = document.querySelector('input[name="tipo"]:checked').value;
        const descricao = document.getElementById('descricao').value;
        const contato = document.getElementById('contato').value;
        const protocolo = document.getElementById('protocolo').value;
        
        let textoTemplate = `${nomeContato} ENTROU EM CONTATO POR ${tipo}, ${descricao}.\nCONTATO: ${contato}\nPROTOCOLO: ${protocolo}`.toUpperCase();

        let subHist = "";
        if (cadastroStatus.tipo === 'ALTERADO') {
            subHist = "DADOS DO CONTRATO QUE FORAM ALTERADOS:\n";
            if (cadastroStatus.eR) subHist += `E-MAIL REMOVIDO: ${cadastroStatus.eR}\n`;
            if (cadastroStatus.nR) subHist += `NUMERO REMOVIDO: ${cadastroStatus.nR}\n`;
            if (cadastroStatus.eA) subHist += `E-MAIL ADICIONADO: ${cadastroStatus.eA}\n`;
            if (cadastroStatus.nA) subHist += `NUMERO ADICIONADO: ${cadastroStatus.nA}\n`;
        } else if (cadastroStatus.tipo === 'NÃO ALTERADO') {
            subHist = "DADOS DO CONTRATO NÃO FORAM ALTERADOS\n";
        }
        
        if (subHist) subHist += `\nCONTATO: ${contato}\nPROTOCOLO: ${protocolo}`;

        historico.push({ id: Date.now(), textoTemplate, subHist, tipo, ...Object.fromEntries(new FormData(form)) });
        localStorage.setItem('atendimentos', JSON.stringify(historico));
        
        cadastroStatus = null;
        form.reset();
        document.querySelector(`input[name="tipo"][value="${tipo}"]`).checked = true;
        renderizar();
    }

    function renderizar() {
        const lista = document.getElementById('listaHistorico');
        lista.innerHTML = historico.slice().reverse().map((r, i) => `
            <div class="card">
                <div class="card-body">${r.textoTemplate}</div>
                ${r.subHist ? `<div class="sub-hist">${r.subHist}</div>` : ''}
                <button onclick="excluir(${r.id})">Excluir</button>
            </div>
        `).join('');
    }
    
    function excluir(id) { if(confirm("Excluir?")) { historico = historico.filter(r => r.id !== id); localStorage.setItem('atendimentos', JSON.stringify(historico)); renderizar(); } }

    renderizar();
</script>
</body>
</html>
